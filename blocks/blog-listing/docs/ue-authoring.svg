<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Blog Listing authoring structure</title>
  <desc id="desc">The Blog Listing block has a heading and description field followed by a Blog Index source field. Cards are generated from the index and are not authored rows.</desc>
  <rect width="720" height="280" fill="#fff"/>
  <rect x="20" y="20" width="680" height="240" rx="8" fill="#f5f5f5" stroke="#535862"/>
  <text x="40" y="54" fill="#181d27" font-family="sans-serif" font-size="18" font-weight="700">Blog Listing</text>
  <rect x="40" y="76" width="640" height="64" rx="6" fill="#fff" stroke="#d5d7da"/>
  <text x="56" y="103" fill="#181d27" font-family="sans-serif" font-size="14" font-weight="700">Row 0 · Heading &amp; Text · Rich Text</text>
  <text x="56" y="125" fill="#535862" font-family="sans-serif" font-size="13">Heading and short description</text>
  <rect x="40" y="154" width="640" height="64" rx="6" fill="#fff" stroke="#d5d7da"/>
  <text x="56" y="181" fill="#181d27" font-family="sans-serif" font-size="14" font-weight="700">Row 1 · Blog Index · Text / link</text>
  <text x="56" y="203" fill="#535862" font-family="sans-serif" font-size="13">Query Index URL; cards are generated at runtime</text>
  <text x="40" y="242" fill="#535862" font-family="sans-serif" font-size="12">Search · filters · responsive cards · pagination</text>
</svg>